spring.application.name=Proyect_Arqui_Backend

# Configuracion local: el archivo .env de la raiz del backend apunta a PostgreSQL local.
# No entra en la imagen de Docker (el Dockerfile solo copia pom.xml y src), asi que
# en Render se usan los valores de este archivo.
spring.config.import=optional:file:.env[.properties]

spring.jpa.database=postgresql
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://dpg-dc4iaj49v7es73f32f6g-a.oregon-postgres.render.com:5432/bdproyectarquibackend_dsrs?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:carloscollao}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:62AmtzOs40ADohNqzxW5fqgzW1DsCMb6}
jwt.

# Resend (envio de correos). La API key no se sube al repositorio: se lee de la
# variable de entorno RESEND_API_KEY. Mientras no se verifique un dominio propio en
# Resend, el remitente debe ser onboarding@resend.dev y solo se puede enviar al
# correo con el que se creo la cuenta de Resend.
resend.api-key=${RESEND_API_KEY:}
resend.remitente=${RESEND_REMITENTE:SaludCerca <onboarding@resend.dev>}

# Jitsi Meet (videollamadas de las citas). Servidor donde se crean las salas.
jitsi.dominio=${JITSI_DOMINIO:meet.jit.si}

# Solo para correr en local (APP_PREPARAR_BD_LOCAL=true en el .env): al arrancar crea
# la base si no existe y carga scripts/datos_prueba.sql si esta vacia. En Render queda apagado.
app.preparar-bd-local=${APP_PREPARAR_BD_LOCAL:false}
